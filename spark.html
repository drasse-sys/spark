<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FF6B6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Spark — Lekseassistent</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
background:linear-gradient(160deg,#667eea 0%,#764ba2 50%,#f093fb 100%);
background-attachment:fixed;min-height:100vh;min-height:100dvh;
display:flex;align-items:center;justify-content:center;padding:10px;overflow-x:hidden}
#app{width:100%;max-width:540px;background:rgba(255,255,255,.96);border-radius:26px;
box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column;
height:calc(100dvh - 20px);max-height:900px}
header{background:linear-gradient(135deg,#FF6B6B,#FFA07A);padding:11px 14px;
display:flex;align-items:center;gap:8px;flex-shrink:0}
.logo{font-size:28px;animation:sparkle 2s ease-in-out infinite}
@keyframes sparkle{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
h1{font-size:18px;font-weight:900;color:#fff;margin:0;letter-spacing:-.4px;line-height:1.1}
.sub{font-size:10.5px;color:rgba(255,255,255,.88);font-weight:700}
.hbtn{min-width:44px;min-height:44px;background:rgba(255,255,255,.28);border:none;border-radius:10px;padding:6px 8px;
color:#fff;font-weight:800;cursor:pointer;font-size:15px;font-family:inherit}
.hbtn.off{background:rgba(0,0,0,.22)}
.hbtn.small{font-size:11px;padding:6px 9px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:18px 16px;display:flex;flex-direction:column;gap:13px}
.center{text-align:center}
.big{font-size:42px}
.t1{font-size:18px;font-weight:900;color:#2d2d3a}
.t2{font-size:12.5px;color:#666;line-height:1.5;font-weight:600}
label{font-size:12px;font-weight:800;color:#555;display:block;margin-bottom:5px}
input[type=text],input[type=password],input[type=url],textarea,select{width:100%;border:2px solid #e0d4f8;
border-radius:13px;padding:11px 13px;font-size:15px;font-family:inherit;font-weight:700;
outline:none;color:#333;background:#fff;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:#a78bfa}
textarea{resize:vertical;line-height:1.5;font-size:14px}
.btn{background:linear-gradient(135deg,#FF6B6B,#FFA07A);color:#fff;border:none;
border-radius:15px;padding:14px;font-size:16px;font-weight:900;cursor:pointer;
font-family:inherit;width:100%;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#f3f0ff;color:#7c5cbf}
.btn.sm{padding:10px;font-size:14px}
.note{background:#FFF9E6;border-radius:12px;padding:11px 14px;font-size:11.5px;
color:#8B6914;line-height:1.6;font-weight:600}
.note.warn{background:#FFF0F0;color:#A03030}
.note.info{background:#EEF4FF;color:#2A4C8B}
.note.ok{background:#ECFDF3;color:#176B3A}
.tabs{display:flex;gap:6px;background:#f3f0ff;border-radius:14px;padding:4px}
.tab{border:0;font-family:inherit;flex:1;text-align:center;padding:10px 6px;border-radius:11px;font-weight:800;
font-size:13px;color:#999;cursor:pointer;transition:all .18s}
.tab.on{background:#fff;color:#7c5cbf;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.kids{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kid{font-family:inherit;padding:7px 13px;border-radius:20px;background:#f3f0ff;color:#7c5cbf;
font-weight:800;font-size:13px;cursor:pointer;border:2px solid transparent}
.kid.on{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.kid.add{background:#fff;border:2px dashed #c0b4f0;color:#a78bfa}
.drop{border:3px dashed #c0b4f0;border-radius:16px;padding:22px;text-align:center;
background:#f8f4ff;cursor:pointer}
.drop img{width:100%;max-height:220px;object-fit:contain;border-radius:12px;display:block}
.chat{padding:14px 12px;display:flex;flex-direction:column;gap:11px}
.row{display:flex;align-items:flex-end;gap:6px;animation:up .3s ease}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.row.me{justify-content:flex-end}
.av{width:31px;height:31px;border-radius:50%;background:linear-gradient(135deg,#FF6B6B,#FFA07A);
display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.bub{max-width:76%;padding:11px 14px;font-size:15px;line-height:1.55;font-weight:600;
white-space:pre-wrap;word-wrap:break-word}
.bub.them{background:#fff;color:#2d2d3a;border:1px solid #f0e8ff;
border-radius:17px 17px 17px 5px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.bub.me{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;
border-radius:17px 17px 5px 17px}
.bub.sys{background:#f0f0f0;color:#888;font-size:12px;border-radius:14px}
.spk{background:#f0e8ff;border:none;border-radius:50%;width:29px;height:29px;
display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;cursor:pointer}
.spk.on{background:linear-gradient(135deg,#FF6B6B,#FFA07A);animation:ring 1s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,107,107,.5)}100%{box-shadow:0 0 0 9px rgba(255,107,107,0)}}
.dots{background:#fff;border:1px solid #f0e8ff;border-radius:17px 17px 17px 5px;
padding:13px 17px;display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:#c0b4f0;animation:bo .8s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bo{0%,100%{transform:scale(.8);opacity:.4}50%{transform:scale(1.2);opacity:1}}
.quick{display:flex;gap:6px;padding:8px 12px 0;flex-wrap:wrap;flex-shrink:0}
.qb{background:#f3f0ff;border:1.5px solid #e0d4f8;border-radius:16px;padding:7px 12px;
font-size:12.5px;font-weight:800;color:#7c5cbf;cursor:pointer;font-family:inherit}
.qb:active{background:#e6ddff}
.donebar{padding:8px 12px 0;flex-shrink:0}
.donebtn{width:100%;border:2px solid #bfe8cc;background:#ecfdf3;color:#176b3a;border-radius:14px;
  padding:9px 12px;font-size:13px;font-weight:900;font-family:inherit;cursor:pointer}
.donebtn:active{transform:scale(.985)}
.donebtn:disabled{opacity:.45;cursor:not-allowed}
footer{padding:9px 12px;border-top:1px solid #f0e8ff;background:#fdfbff;
display:flex;gap:7px;align-items:flex-end;flex-shrink:0}
footer textarea{flex:1;border-radius:15px;padding:11px 13px;max-height:96px;
overflow-y:auto;resize:none;font-size:15px}
.send{background:linear-gradient(135deg,#FF6B6B,#FFA07A);color:#fff;border:none;
border-radius:13px;width:44px;height:44px;font-size:19px;cursor:pointer;flex-shrink:0}
.mic{background:#f3f0ff;color:#7c5cbf;border:1.5px solid #e0d4f8;border-radius:13px;
width:44px;height:44px;font-size:18px;cursor:pointer;flex-shrink:0}
.mic.on{background:#ffe9e9;color:#b33232;animation:ring 1s infinite}
.send:disabled{opacity:.45}
.stars{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.25);
border-radius:11px;padding:5px 8px;font-size:12px;font-weight:900;color:#fff}
.prof{background:#F4F9F4;border-radius:12px;padding:11px 14px;font-size:11.5px;
color:#2E5C3E;line-height:1.65;font-weight:600}
.prof li{margin:3px 0}
.hide{display:none!important}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#d5c9f5;border-radius:3px}

.math-visual{margin:8px 0;max-width:100%;white-space:normal}.math-visual svg,.prof svg{width:100%;height:auto;max-height:260px}.math-visual figcaption{font-size:12px;line-height:1.4}.learning-panel,.reading-panel,.practice{padding:12px;background:#f5f1fc;border-radius:14px;line-height:1.5}.learning-panel button,.reading-panel button,.practice button{margin:4px 0;min-height:40px}.ladder-label{font-size:12px;width:100%;color:#504076}.reading-active{background:#ffe3a0}h2{font-size:17px}.quick{max-height:145px;overflow-y:auto}.prof{overflow-wrap:anywhere}.prof input[type=file]{max-width:100%}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">⚡</div>
    <div style="flex:1;min-width:0">
      <h1>Spark</h1>
      <div class="sub" id="who">Lekseassistenten din 🌟</div>
    </div>

    <button class="hbtn" id="voiceBtn" aria-label="Slå tale av eller på">🔊</button>
    <button class="hbtn small hide" id="backBtn" aria-label="Tilbake til oppgaver">←</button>
    <button class="hbtn small hide" id="newBtn" aria-label="Ny oppgave">🔄</button>
    <button class="hbtn small" id="cogBtn" aria-label="Innstillinger">⚙️</button>
  </header>
  <div id="status" class="note warn hide" role="status" aria-live="polite"></div>
  <main id="main"></main>
  <div class="quick hide" id="quick"></div>
  <div class="donebar hide" id="doneBar"><button class="donebtn" id="doneBtn">✅ Ferdig med leksa</button></div>
  <footer id="foot" class="hide">
    <textarea id="msg" aria-label="Svaret ditt" rows="1" placeholder="Skriv eller si svaret ditt... ✏️"></textarea>
    <button class="mic hide" id="micBtn" aria-label="Snakk inn svar">🎙️</button>
    <button class="send" id="sendBtn" aria-label="Send svar">🚀</button>
  </footer>
</div>

<script src="arithmetic.js"></script>
<script src="learning.js"></script>
<script src="visuals.js"></script>
<script src="learning-ui.js"></script>
<script>
/* ================= SPARK v5.3 =================
   Privat Worker beskytter leverandørnøkler.
   Profiler, økter og enhetstoken lagres lokalt på denne telefonen.
============================================== */

const LS = { kids:'spark_kids', active:'spark_active', voice:'spark_voice',
             voiceName:'spark_voice_name', sess:'spark_session',
             server:'spark_server_url', device:'spark_device_token', tokenServer:'spark_device_server' };

/* Spark v5.3 bruker en liten privat backend. Leverandør-nøkler skal aldri ligge på telefonen. */
const DEFAULT_SERVER_URL = 'https://spark-family-api.drasse.workers.dev';

let storageWarning = '', voiceNotice = '';
function showStatus(){
  const el=document.getElementById('status');
  el.textContent=[storageWarning,voiceNotice].filter(Boolean).join(' ');
  el.classList.toggle('hide',!el.textContent);
}
const store = {
  getItem(key){ try{return localStorage.getItem(key);}catch{ storageWarning='Lokal lagring er utilgjengelig. Ikke lukk appen før økten er lagret.'; showStatus(); return null;} },
  setItem(key,value){ try{localStorage.setItem(key,value);return true;}catch{ storageWarning='Kunne ikke lagre på denne telefonen. Frigjør plass og prøv igjen. Behold appen åpen.'; showStatus();return false;} },
  removeItem(key){ try{localStorage.removeItem(key);return true;}catch{ storageWarning='Kunne ikke oppdatere lokal lagring. Behold appen åpen og prøv igjen.';showStatus();return false;} }
};

// Migrering fra v5.1: slett eventuelle gamle leverandør-nøkler fra nettleseren.
['spark_key','spark_backup_key','spark_backup_model','spark_backup','spark_prov','spark_model']
  .forEach(k=>store.removeItem(k));

function normalizeServer(v){ return String(v||'').trim().replace(/\/+$/,''); }
function validServer(value){
  try{ const u=new URL(value); return !u.username && !u.password && !u.search && !u.hash &&
    u.pathname==='/' && (u.protocol==='https:' || (u.protocol==='http:' && ['localhost','127.0.0.1','[::1]'].includes(u.hostname))); }catch{return false;}
}
let serverUrl = normalizeServer(store.getItem(LS.server) || DEFAULT_SERVER_URL);
let deviceToken = store.getItem(LS.device) || '';
let tokenServer = normalizeServer(store.getItem(LS.tokenServer) || '');
let voiceOn  = store.getItem(LS.voice) !== '0';
function paired(){ return !!(serverUrl && deviceToken && tokenServer===serverUrl); }

/* ---- barneprofiler ---- */
function blankKid(name){
  return { name:name||'', age:8, interests:'', stars:0, notes:[], log:[], sessions:[], level:'', learning:L.empty(), readAloud:false };
}
let migrationReady=L.migrate(store,Date.now());
let kids = [];
try { kids = JSON.parse(store.getItem(LS.kids) || '[]'); } catch(e){ kids=[]; }
if(!Array.isArray(kids)) kids=[];
// Keep profile positions stable: session keys are indexed by child.
kids=kids.map(value=>{
  const k=value && typeof value==='object' && !Array.isArray(value)?value:{};
  return {
  ...blankKid(''), ...k,
  name:typeof k.name==='string'?k.name.slice(0,40):'',
  age:Number.isInteger(k.age)?Math.max(4,Math.min(16,k.age)):8,
  interests:typeof k.interests==='string'?k.interests.slice(0,120):'',
  stars:Number.isFinite(k.stars)?Math.max(0,k.stars):0,
  notes:Array.isArray(k.notes)?k.notes.filter(n=>typeof n==='string').map(n=>n.slice(0,90)).slice(-12):[],
  log:Array.isArray(k.log)?k.log.filter(e=>e && ['d','m','t'].every(x=>typeof e[x]==='string')).slice(-20):[],
  sessions:Array.isArray(k.sessions)?k.sessions.filter(e=>e && typeof e.d==='string' && typeof e.m==='string' && typeof e.t==='string' && (validChat(e.msgs)||Array.isArray(e.msgs)&&e.msgs.length===0)):[],
  learning:L.normalizeMemory(k.learning)
  };
});
if(!kids.length) kids=[blankKid('')];
kids.forEach(k=>L.prune(k,Date.now()));
if(migrationReady)store.setItem(LS.kids,JSON.stringify(kids));
try{const backup=JSON.parse(store.getItem('spark_learning_backup')||'null');if(backup&&Date.now()-backup.createdAt>=30*L.DAY)store.removeItem('spark_learning_backup');}catch{}
let active = Number(store.getItem(LS.active) || '0');
if(!Number.isInteger(active) || active<0 || active>=kids.length) active=0;
const kid = () => kids[active];
function saveKids(){
  if(!migrationReady){storageWarning='Migreringen kunne ikke lagres. Frigjør plass og last appen på nytt. Eksisterende data er bevart.';showStatus();return false;}
  kids.forEach(k=>L.prune(k,Date.now()));
  const saved=store.setItem(LS.kids, JSON.stringify(kids));
  return store.setItem(LS.active, String(active)) && saved;
}

/* ---- tilstand ---- */
let view = paired() ? 'start' : 'setup';
let taskMode = 'lekse';       // lekse | matte | lesing | quiz

const MODE_HELP = {
  matte:  'Regner aldri ut svaret for barnet. Sjekker sin egen regning, og skiller slurvefeil fra begrepsfeil.',
  lesing: 'Hjelper med forståelse, ord og gjenfortelling — og lærer barnet å finne belegg i teksten. Kan IKKE høre barnet lese høyt.',
  lekse:  'Vanlig skolearbeid. Spark holder tilbake svaret uansett hvor mye barnet maser.',
  quiz:   'For rektors quiz og annen allmennkunnskap utenfor pensum. Jobber seg fram til svaret hvis barnet står fast.'
};
const MODE_ICON = { matte:'🔢', lesing:'📕', lekse:'📚', quiz:'🧠' };
const PLACEHOLD = {
  matte:  'F.eks: «Regn ut 24 + 37» eller «3 poser med 8 epler i hver»',
  lesing: 'Lim inn teksten han skal lese, eller skriv spørsmålet om teksten',
  lekse:  'Skriv oppgaven her',
  quiz:   'F.eks: «Hva heter planetene mellom jorden og sola?»'
};
const OPENERS = {
  matte:  'Her er matteoppgaven min! Hjelp meg å regne den ut selv, ett steg om gangen.',
  lesing: 'Her er teksten jeg skal jobbe med. Hjelp meg å forstå den!',
  lekse:  'Her er leksa mi! Kan du hjelpe meg å forstå den?',
  quiz:   'Her er quiz-spørsmålene mine! Ta dem ett om gangen.'
};
const MODE_NAME = { matte:'Matte', lesing:'Lesing', lekse:'Lekser', quiz:'Quiz' };
let inputMode = 'camera';     // camera | text
let hwPreview = null, hwText = '';
let chatMsgs = [], history = [], transcript = '';
let busy = false, speakingIdx = null, readOnly = false, backupAnnounced = false;
let recognition = null, listening = false;
let startNotice = '';
let pendingFinal = null, photoLoad = 0, currentSessionId = '';
const newSessionId = () => Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
function chooseChild(index){
  if(index===active) return;
  stopSpeak(); stopMic(); photoLoad++; hwPreview=null; hwText=''; $('msg').value='';
  chatMsgs=[]; history=[]; transcript=''; pendingFinal=null; readOnly=false; currentSessionId='';
  resetLearning(); active=index; saveKids();
}

const $ = id => document.getElementById(id);
const main = $('main'), foot = $('foot'), quick = $('quick'), doneBar = $('doneBar');
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= SYSTEMPROMPT ================= */

/* ================= TALE ================= */
const synth = window.speechSynthesis;
let voiceList = [];
let speechGeneration = 0;
let voiceName = store.getItem(LS.voiceName) || '';

function voiceId(v){ return v.voiceURI || v.name; }
function savedVoice(voices){
  return voiceName && (voices.find(v=>voiceId(v)===voiceName) || voices.find(v=>v.name===voiceName));
}
function norwegianRank(v){
  const lang=String(v.lang||'').replace(/_/g,'-').toLowerCase();
  const preferred=['nb-no','no-no','nb','no'];
  const rank=preferred.indexOf(lang);
  return rank>=0?rank:(/^(nb|no)-/.test(lang)?4:(lang==='nn-no'?5:Infinity));
}
function refreshVoices(){ voiceList = synth ? synth.getVoices() : []; }
function norwegianVoices(){
  refreshVoices();
  return voiceList.filter(v=>Number.isFinite(norwegianRank(v)));
}
function pickVoice(){
  refreshVoices();
  // Preserve a saved manual choice while asynchronous lists are empty.
  const manual=savedVoice(voiceList);
  if(manual) return manual;
  return norwegianVoices().slice().sort((a,b)=>norwegianRank(a)-norwegianRank(b) ||
    Number(b.default)-Number(a.default) || Number(b.localService)-Number(a.localService))[0] || null;
}
function voiceOptions(){
  const voices=norwegianVoices();
  const manual=savedVoice(voices);
  return `<option value="" ${!voiceName?'selected':''}>Automatisk — beste norske stemme på denne enheten</option>`+
    (voiceName&&!manual?`<option value="${esc(voiceName)}" selected>Valgt stemme er ikke tilgjengelig ennå</option>`:'')+
    voices.map(v=>`<option value="${esc(voiceId(v))}" ${v===manual?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
}
if(synth){
  refreshVoices();
  synth.addEventListener('voiceschanged', ()=>{
    refreshVoices();
    if($('fVoice')) $('fVoice').innerHTML=voiceOptions();
    if(pickVoice()){ voiceNotice=''; showStatus(); }
  });
}
function speechText(text){
  return stripLearningMarkers(text)
    .replace(/⭐\s*POENG!?/gi,'')
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'')
    .replace(/[*_#`~]/g,' ')
    .replace(/(\d)\s*[×x]\s*(\d)/gi,'$1 ganger $2')
    .replace(/(\d)\s*\/\s*(\d)/g,'$1 delt på $2')
    .replace(/(\d)\s*\+\s*(\d)/g,'$1 pluss $2')
    .replace(/(\d)\s*-\s*(\d)/g,'$1 minus $2')
    .replace(/\s*=\s*/g,' er lik ')
    .replace(/(\d)\s*%/g,'$1 prosent')
    .replace(/(\d)\s*kr\b/gi,'$1 kroner')
    .replace(/(\d)\s*cm\b/gi,'$1 centimeter')
    .replace(/(\d)\s*mm\b/gi,'$1 millimeter')
    .replace(/(\d)\s*kg\b/gi,'$1 kilo')
    .replace(/(\d)\s*dl\b/gi,'$1 desiliter')
    .replace(/(\d)\s*l\b/gi,'$1 liter')
    .replace(/\s+/g,' ').trim();
}
function speak(text, idx, force=false){
  if(!voiceOn && !force) return;
  if(!synth){voiceNotice='Denne nettleseren støtter ikke opplesing. Prøv en nettleser med norsk tale.';showStatus();return;}
  stopSpeak();
  const generation=speechGeneration;
  const clean = speechText(text);
  if(!clean) return;
  const u = new SpeechSynthesisUtterance(clean);
  const v = pickVoice();
  if(!v){ voiceNotice='Ingen norsk stemme er tilgjengelig ennå. Velg eller installer en norsk stemme i telefonens taleinnstillinger, og prøv igjen under ⚙️ Stemme.'; showStatus(); return; }
  voiceNotice=''; showStatus();
  u.voice = v; u.lang = v.lang.replace(/_/g,'-');
  u.rate=.96; u.pitch=1.0; u.volume=1;
  u.onstart=()=>{if(generation!==speechGeneration)return;speakingIdx=idx;if(view==='chat') render()};
  u.onend=u.onerror=()=>{if(generation!==speechGeneration)return;speakingIdx=null;if(view==='chat') render()};
  synth.speak(u);
}
function stopSpeak(){ readingRun++; readingSentence=-1; speechGeneration++; if(synth) synth.cancel(); speakingIdx=null; }
function stopMic(){ const old=recognition; recognition=null; listening=false; if(old){ old.onresult=old.onend=old.onerror=old.onstart=null; try{old.abort();}catch(e){} } }

/* ================= BILDE ================= */
function shrink(file){
  return new Promise((res,reject)=>{
    const fail=()=>reject(new Error('Kunne ikke åpne bildet. Prøv et annet bilde i JPEG- eller PNG-format.'));
    const r=new FileReader(); r.onerror=r.onabort=fail;
    r.onload=e=>{
      const img=new Image(); img.onerror=fail;
      img.onload=()=>{
        try{
        const max=1100; let {width:w,height:h}=img;
        if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',.72));
        }catch{fail();}
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

/* ====== token-sparing: bytt bildet mot avskriften, klipp gammel historikk ====== */
function slimHistory(){
  return history.map(m=>{
    if(typeof m.content === 'string') return m;
    const txt = m.content.filter(b=>b.type==='text').map(b=>b.text).join('\n');
    return { role:m.role, content:(transcript ? 'Oppgaven:\n'+transcript+'\n\n' : '') + txt };
  });
}
function payload(){
  let h = transcript ? slimHistory() : history;   // avskrift finnes -> bildet droppes
  if(h.length > 14) h = [h[0], ...h.slice(-12)];  // behold oppgaven + siste 12
  return h;
}

/* ====== lagring av økt, så ingenting går tapt ved feiltrykk ====== */
function validChat(msgs){ return Array.isArray(msgs) && msgs.length>0 && msgs.every(m=>m && ['user','assistant'].includes(m.role) && typeof m.text==='string'); }
function validHistory(msgs){ return Array.isArray(msgs) && msgs.length>0 && msgs.every(m=>m && ['user','assistant'].includes(m.role) &&
  (typeof m.content==='string' || (Array.isArray(m.content) && m.content.length>0 && m.content.every(p=>p &&
    ((p.type==='text' && typeof p.text==='string') || (p.type==='image' && typeof p.source?.data==='string' && typeof p.source?.media_type==='string')))))); }
function sessionKey(i=active){ return LS.sess + '_' + i; }
function migrateLegacySession(){
  try{
    const old = store.getItem(LS.sess);
    if(!old) return;
    const s = JSON.parse(old);
    const idx = Number.isInteger(s?.kid) ? s.kid : active;
    if(!store.getItem(sessionKey(idx)) && !store.setItem(sessionKey(idx), old)) return;
    store.removeItem(LS.sess);
  }catch(e){}
}
migrateLegacySession();
function saveSession(){
  if(learningSession)L.boundSession(learningSession);
  if(!migrationReady)return false;
  try{
    if(!currentSessionId) currentSessionId=newSessionId();
    return store.setItem(sessionKey(), JSON.stringify({
      id:currentSessionId, kid:active, mode:taskMode, transcript,
      chatMsgs, history:transcript?slimHistory():history, pendingFinal, usingBackup, ts:Date.now(), learning:ensureLearning(), schema:3
    }));
  }catch(e){ storageWarning='Kunne ikke lagre økten. Behold appen åpen og prøv igjen.';showStatus();return false; }
}
function loadSession(i=active){
  try{
    const s = JSON.parse(store.getItem(sessionKey(i))||'null');
    if(!s || s.kid!==i || !Object.hasOwn(MODE_NAME,s.mode) || !validChat(s.chatMsgs) || !validHistory(s.history) || typeof s.transcript!=='string') return null;
    const savedAt=[s.ts,s.migratedAt].find(t=>Number.isSafeInteger(t)&&t>0);
    if(savedAt&&Date.now()-savedAt>=30*L.DAY){
      if(s.learning?.id&&Array.isArray(s.learning.events)&&!kids[i].learning.sessions.some(a=>a.id===s.learning.id)){
        kids[i].learning.sessions.push(L.aggregate(s.learning,s.mode,savedAt));
        if(!saveKids())return null;
      }
      store.removeItem(sessionKey(i));return null;
    }
    if(s.id && kids[i]?.sessions.some(archived=>archived.id===s.id)) return null;
    return s;
  }catch(e){ return null; }
}
function resumeSession(){
  const s = loadSession(); if(!s) return;
  startNotice='';
  readOnly=false; stopSpeak(); stopMic();
  taskMode = s.mode || 'lekse';
  transcript = s.transcript || '';
  chatMsgs = s.chatMsgs; history = s.history;
  currentSessionId=typeof s.id==='string'?s.id:newSessionId();
  restoreLearning(s);
  pendingFinal=typeof s.pendingFinal?.summary==='string'?s.pendingFinal:null;
  usingBackup=!!s.usingBackup; backupAnnounced=usingBackup;
  $('msg').value='';
  view='chat'; render();
}
function archiveSession(summary=''){
  if(!chatMsgs.length) return true;
  const k = kid();
  const previous=k.sessions;
  const previousLearning=(k.learning ||= L.empty()).sessions.slice();
  const ls=ensureLearning();
  const endedAt=Date.now();
  if(ls.reflection&&ls.task?.skill&&k.learning.skills[ls.task.skill]&&ls.task.s<=1&&ls.task.completed)k.learning.skills[ls.task.skill].helped=ls.reflection;
  if(!k.learning.sessions.some(s=>s.id===ls.id))k.learning.sessions.push(L.aggregate(ls,taskMode,endedAt));
  if(!k.sessions) k.sessions = [];
  k.sessions=k.sessions.slice();
  k.sessions.push({
    id:currentSessionId || newSessionId(),
    d:new Date().toLocaleDateString('no-NO'),
    startedAt:ls.startedAt, endedAt,
    m:taskMode,
    t:(transcript||chatMsgs[0]?.text||'Økt').slice(0,60),
    summary:(summary||'').slice(0,260),
    msgs:chatMsgs.slice(-40)
  });
  // Retain structured aggregates independently of transcript retention.
  L.prune(k,Date.now());
  if(!saveKids()){ k.sessions=previous; k.learning.sessions=previousLearning; return false; }
  if(store.removeItem(sessionKey())) storageWarning='';
  showStatus();
  return true;
}

/* ================= API VIA PRIVAT SPARK-SERVER ================= */
const DAILY = /per day|daily limit|requests per day|\bRPD\b|GenerateRequestsPerDay|dagskvote/i;
const MINUTE = /per minute|requests per minute|tokens per minute|\bRPM\b|\bTPM\b|rate limit|for mange forespørsler/i;
function errText(err){ return ((err&&err.message)||'') + ' ' + ((err&&err.details)||''); }
function isDailyQuota(err){ return DAILY.test(errText(err)); }
function isMinuteQuota(err){
  const t=errText(err);
  return !isDailyQuota(err) && (err?.kind==='minute_quota' || err?.status===429 || MINUTE.test(t) || /RESOURCE_EXHAUSTED|429/i.test(t));
}
async function fetchServer(path, options){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),path==='/pair'?20000:150000);
  try{return await fetch(endpoint(path),{...options,signal:controller.signal});}
  catch(err){
    if(controller.signal.aborted) throw new Error('Spark-serveren brukte for lang tid. Vent litt og prøv igjen.');
    throw err;
  }finally{clearTimeout(timer);}
}
function endpoint(path){
  if(!serverUrl) throw new Error('Spark-serveren er ikke satt opp. Åpne ⚙️ Innstillinger.');
  return serverUrl + path;
}
async function pairDevice(code){
  serverUrl=normalizeServer(serverUrl);
  if(!validServer(serverUrl)) throw new Error('Serveradressen må være en HTTPS-adresse uten sti. Lokal testing kan bruke http://localhost.');
  if(!code || code.trim().length<6) throw new Error('Familiekoden mangler eller er for kort.');
  const r=await fetchServer('/pair',{
    method:'POST', headers:{'content-type':'application/json'},
    body:JSON.stringify({code:code.trim(), deviceName:'Spark-enhet'})
  });
  const d=await r.json().catch(()=>({}));
  if(!r.ok || !d.token) throw new Error(d.error||('Kunne ikke koble enheten ('+r.status+').'));
  deviceToken=d.token; tokenServer=serverUrl;
  store.setItem(LS.server,serverUrl);
  store.setItem(LS.device,deviceToken);
  store.setItem(LS.tokenServer,tokenServer);
  return true;
}
function unpairDevice(){
  deviceToken=''; tokenServer='';
  store.removeItem(LS.device); store.removeItem(LS.tokenServer);
}

let usingBackup = false;
async function callAI(messages){
  if(!paired()) throw new Error('Denne enheten er ikke koblet til Spark-serveren. Åpne ⚙️ Innstillinger.');
  const k=kid();
  const r=await fetchServer('/chat',{
    method:'POST',
    headers:{'content-type':'application/json','authorization':'Bearer '+deviceToken},
    body:JSON.stringify({mode:taskMode,age:k.age,name:k.name||'',interests:k.interests||'',notes:(k.notes||[]).slice(-8),sessionState:learningContext(),messages,transcript:transcript||''})
  });
  const d=await r.json().catch(()=>({}));
  if(r.status===401 && !d.kind){
    unpairDevice();
    const e=new Error('Koblingen til Spark-serveren er utløpt. En forelder må koble denne enheten på nytt i ⚙️.');
    e.status=401; throw e;
  }
  if(!r.ok || typeof d.text!=='string' || !d.text.trim()){
    const e=new Error(d.error||('Spark-serverfeil ('+r.status+')'));
    e.status=r.status; e.kind=d.kind||''; e.details=(d.kind||'')+' '+(d.details||''); throw e;
  }
  ensureLearning().interventions+=(d.verifier?.interventions||0);
  usingBackup = d.provider && d.provider!=='gemini';
  return d.text.trim();
}

/* ============ PROFIL-LÆRING + POENG ============ */
function addParentLog(entry){
  const clean=(entry||'').trim().replace(/\s+/g,' ').slice(0,240);
  if(!clean) return false;
  const k=kid();
  const last=k.log[k.log.length-1];
  if(last && last.m===taskMode && last.t===clean) return false;
  k.log.push({ d:new Date().toLocaleDateString('no-NO'), ts:Date.now(), m:taskMode, t:clean });
  if(k.log.length > 20) k.log.shift();
  return true;
}
function harvest(raw,final=false){
  const k = kid();
  let changed = false;

  // profil-notater
  const re = /\[\[PROFIL:\s*([^\]]+)\]\]/gi;
  let m;
  while((m = re.exec(raw)) !== null){
    const note = m[1].trim().slice(0,90);
    if(note && !k.notes.includes(note)){
      k.notes.push(note);
      if(k.notes.length > 12) k.notes.shift();   // behold de nyeste
      changed = true;
    }
  }

  // avskrift av oppgaven -> lar oss droppe bildet fra videre kall
  const ore = /\[\[OPPGAVE:\s*([\s\S]+?)\]\]/i;
  const om = raw.match(ore);
  if(om && !transcript) transcript = om[1].trim().slice(0,20000);
  if(transcript&&!ensureLearning().task.expression){
    const expression=detectExpression(transcript);
    if(expression){learningSession.task.expression=expression;learningSession.task.skill=arithmeticSkill(expression);}
  }

  // foreldre-logg
  const lre = /\[\[LOGG:\s*([^\]]+)\]\]/gi;
  let lm;
  while((lm = lre.exec(raw)) !== null){
    const entry = lm[1].trim().slice(0,240);
    if(addParentLog(entry)) changed = true;
  }

  if(!final)receiveLearning(raw);
  if(changed) saveKids();
  return demarkdown(stripLearningMarkers(raw));
}

/* Fjerner markdown uten å ødelegge gangetegn (3 * 4 beholdes) */
function demarkdown(t){
  return t
    .replace(/\*\*([^*\n]+)\*\*/g, '$1')      // **fet**
    .replace(/__([^_\n]+)__/g, '$1')            // __fet__
    .replace(/(^|\s)\*([^*\s][^*\n]*?)\*(?=\s|[.,!?:;]|$)/g, '$1$2')  // *kursiv*
    .replace(/(^|\s)_([^_\s][^_\n]*?)_(?=\s|[.,!?:;]|$)/g, '$1$2')      // _kursiv_
    .replace(/^\s{0,3}#{1,6}\s+/gm, '')          // ## overskrift
    .replace(/^\s{0,3}[-*+]\s+/gm, '• ')         // punktliste
    .replace(/`{1,3}([^`]*)`{1,3}/g, '$1')       // kode
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

      <div class="tabs" id="modeTabs" style="flex-wrap:wrap">
        <button type="button" class="tab ${taskMode==='matte'?'on':''}" data-t="matte">🔢 Matte</button>
        <button type="button" class="tab ${taskMode==='lesing'?'on':''}" data-t="lesing">📕 Lesing</button>
        <button type="button" class="tab ${taskMode==='lekse'?'on':''}" data-t="lekse">📖 Annet</button>
        <button type="button" class="tab ${taskMode==='quiz'?'on':''}" data-t="quiz">🧠 Quiz</button>
      </div>
      <div class="t2" style="margin-top:6px;font-size:11px">${MODE_HELP[taskMode]}</div>
    </div>

    <div class="tabs" id="inTabs">
      <button type="button" class="tab ${inputMode==='camera'?'on':''}" data-m="camera">📷 Ta bilde</button>
      <button type="button" class="tab ${inputMode==='text'?'on':''}" data-m="text">✏️ Skriv</button>
    </div>

    ${inputMode==='camera'?`
      <div class="drop" id="drop" role="button" tabindex="0" aria-label="Ta eller velg bilde av oppgaven">
        ${hwPreview?`<img src="${hwPreview}" alt="oppgave">`:
          `<div style="font-size:36px">📷</div>
           <div style="font-weight:900;color:#7c5cbf;margin-top:7px">Trykk for å ta bilde</div>
           <div class="t2" style="font-size:11px;margin-top:3px">Eller velg fra galleriet</div>`}
      </div>
      <input type="file" id="file" accept="image/*" capture="environment" style="display:none">
      ${hwPreview?`<button class="btn ghost sm" id="clearImg">✕ Ta nytt bilde</button>`:''}
    `:`
      <div>
        <label>✏️ Skriv oppgaven:</label>
        <textarea id="hwT" rows="4" placeholder="${PLACEHOLD[taskMode]}">${esc(hwText)}</textarea>
      </div>
    `}

    <button class="btn" id="go" ${(inputMode==='camera'? !hwPreview : hwText.trim().length<4)?'disabled':''}>
      🚀 Sett i gang!
    </button>

    ${learningStartHTML()}
    ${(kid().sessions&&kid().sessions.length)
      ? `<button class="btn ghost sm" id="histBtn">📂 Tidligere økter (${kid().sessions.length})</button>`
      : ''}
  </div>`;

  bindLearningStart();
  if($('resumeBtn')) $('resumeBtn').onclick=resumeSession;
  if($('histBtn')) $('histBtn').onclick=()=>{ view='hist'; render(); };
  document.querySelectorAll('#modeTabs .tab').forEach(t=>t.onclick=()=>{taskMode=t.dataset.t;render()});
  document.querySelectorAll('#inTabs .tab').forEach(t=>t.onclick=()=>{inputMode=t.dataset.m;render()});
  if($('kidPick')) document.querySelectorAll('#kidPick .kid').forEach(t=>t.onclick=()=>{
    chooseChild(parseInt(t.dataset.i,10)); render();
  });
  const drop=$('drop'), file=$('file');
  if(drop){ drop.onclick=()=>file.click(); drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click();}}; }
  if(file) file.onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    const load=++photoLoad, owner=active;
    try{ const image=await shrink(f); if(load===photoLoad && owner===active && view==='start'){hwPreview=image;render();} }
    catch(err){if(load===photoLoad) alert(err.message);}
  };
  if($('clearImg')) $('clearImg').onclick=()=>{photoLoad++;hwPreview=null;render()};
  if($('hwT')) $('hwT').oninput=e=>{hwText=e.target.value; $('go').disabled=hwText.trim().length<4};
  $('go').onclick=start;
}

function renderChat(){
  main.innerHTML=`<div class="chat" id="chatBox"></div>`;
  const box=$('chatBox');
  chatMsgs.forEach((m,i)=>{
    const row=document.createElement('div');
    row.className='row'+(m.role==='user'?' me':'');
    if(m.role!=='user'){
      const a=document.createElement('div');a.className='av';a.textContent='⚡';row.appendChild(a);
    }
    const b=document.createElement('div');
    b.className='bub '+(m.sys?'sys':(m.role==='user'?'me':'them'));
    b.textContent=m.text;
    for(const visual of m.visuals||[]){const node=document.createElement('div');node.innerHTML=V.render(visual,!!learningSession?.check);b.appendChild(node);}
    row.appendChild(b);
    if(m.role!=='user'&&!m.sys&&voiceOn){
      const s=document.createElement('button');
      s.setAttribute('aria-label',speakingIdx===i?'Stopp opplesing':'Les meldingen høyt');
      s.className='spk'+(speakingIdx===i?' on':'');
      s.textContent=speakingIdx===i?'⏹':'🔊';
      s.onclick=()=>speakingIdx===i?(stopSpeak(),render()):speak(m.text,i);
      row.appendChild(s);
    }
    box.appendChild(row);
  });
  if(busy){
    const row=document.createElement('div');row.className='row';
    row.innerHTML=`<div class="av">⚡</div><div class="dots"><i></i><i></i><i></i></div>`;
    box.appendChild(row);
  }
  renderLearningPanel(box);
  renderQuick();
  main.scrollTop=main.scrollHeight;
}

function renderQuick(){
  learningQuick();
}

/* ================= FLYT ================= */
async function start(){
  if(busy || !paired()) return;
  if(inputMode==='camera'?!hwPreview:hwText.trim().length<4) return;
  stopSpeak(); stopMic();
  startNotice='';
  const old = loadSession();
  if(old && old.chatMsgs?.length>0){
    const ok = confirm('Du har en uferdig økt for '+(kid().name||'dette barnet')+'. Starte ny oppgave? Den gamle legges i Tidligere økter.');
    if(!ok) return;
    const prevChat=chatMsgs, prevHistory=history, prevTranscript=transcript, prevMode=taskMode, prevId=currentSessionId, prevLearning=learningSession;
    chatMsgs=old.chatMsgs||[]; history=old.history||[]; transcript=old.transcript||''; taskMode=old.mode||taskMode;
    currentSessionId=old.id||newSessionId(); restoreLearning(old);
    const archived=archiveSession(old.pendingFinal?.summary||'');
    chatMsgs=prevChat; history=prevHistory; transcript=prevTranscript; taskMode=prevMode;
    currentSessionId=prevId; learningSession=prevLearning;
    if(!archived) return;
  }
  if(inputMode==='camera'&&hwPreview){
    history=[{role:'user',content:[
      {type:'image',source:{type:'base64',media_type:'image/jpeg',data:hwPreview.split(',')[1]}},
      {type:'text',text:OPENERS[taskMode]}
    ]}];
    chatMsgs=[{role:'user',text:'📸 Bilde sendt!',sys:true}];
  } else {
    history=[{role:'user',content:`${OPENERS[taskMode]}\n\n${hwText}`}];
    chatMsgs=[{role:'user',text:'📝 '+hwText.slice(0,70)+(hwText.length>70?'...':''),sys:true}];
  }
  readOnly=false; transcript=''; pendingFinal=null; currentSessionId=''; usingBackup=false; backupAnnounced=false; $('msg').value='';
  initHomeworkLearning(inputMode==='text'?hwText:'');
  chatMsgs.forEach(m=>m.ts=Date.now());
  view='chat'; busy=true; saveSession(); render();
  await turn();
}

async function send(){
  const t=$('msg').value.trim();
  if(!t||busy||readOnly||pendingFinal||view!=='chat') return;
  if(interceptAnswer(t))return;
  touchLearning(); ensureLearning().task.attempts++;
  if(!ensureLearning().task.expression){const expression=detectExpression(t);if(expression){learningSession.task.expression=expression;learningSession.task.skill=arithmeticSkill(expression);}}
  stopSpeak(); stopMic();
  $('msg').value=''; $('msg').style.height='auto';
  chatMsgs.push({role:'user',text:t,ts:Date.now()});
  history.push({role:'user',content:t});
  busy=true; saveSession(); render();
  await turn();
}

async function turn(retried){
  try{
    const raw = await callAI(payload());
    history.push({role:'assistant',content:raw});
    const shown = harvest(raw);
    if(usingBackup && !backupAnnounced){
      backupAnnounced = true;
      chatMsgs.push({role:'assistant',
        text:'🛟 Gemini er tom for i dag, så jeg fortsetter med reserven. Jeg husker oppgaven!',
        sys:true});
    }
    chatMsgs.push({role:'assistant',text:shown,ts:Date.now(),visuals:nextVisuals});
    busy=false; saveSession(); render();
    speak(shown, chatMsgs.length-1);
  }catch(err){
    let m = err.message||'Ukjent feil';

    // minutt-kvote: vent litt og prøv en gang til av seg selv
    const perMinute = isMinuteQuota(err);
    if(perMinute && !retried){
      chatMsgs.push({role:'assistant',text:'⏳ Litt for kjapt for gratis-kvoten. Jeg venter et halvt minutt og prøver igjen...',sys:true});
      render();
      await new Promise(r=>setTimeout(r,30000));
      chatMsgs.pop();
      return turn(true);
    }

    busy=false;
    if(isDailyQuota(err))
      m = 'Dagens gratis-kvote er brukt opp. Økten er lagret — dere kan fortsette i morgen. 😊';
    else if(isMinuteQuota(err))
      m = 'For mange spørsmål på kort tid. Vent et minutt og prøv igjen.';
    else if(!err.kind && /koblet|401|403|PERMISSION/i.test(m))
      m = 'Spark-serveren trenger foreldrehjelp. Åpne ⚙️ og koble denne enheten til på nytt.';
    else if(err.kind==='provider_error')
      m = 'AI-tjenesten er midlertidig utilgjengelig. Økten beholdes her. Vent litt og prøv igjen.';
    else if(/Failed to fetch|NetworkError/i.test(m))
      m = 'Fikk ikke kontakt med nettet. Sjekk forbindelsen og prøv igjen.';
    chatMsgs.push({role:'assistant',text:'Oi! '+m,sys:true});
    saveSession(); render();
  }
}

/* ================= FERDIG MED LEKSA ================= */
function fallbackFinalSummary(){
  const topic=(transcript||chatMsgs[0]?.text||MODE_NAME[taskMode]||'Lekse')
    .replace(/\s+/g,' ').replace(/^📸 Bilde sendt!$|^📝\s*/,'').slice(0,90);
  return `${MODE_NAME[taskMode]||'Lekse'}: ${topic || 'økt avsluttet'} | Se samtalen for mestring og framgang | Automatisk sluttoppsummering var ikke tilgjengelig`;
}

async function finishHomework(){
  if(busy || readOnly || chatMsgs.length<2) return;
  const ok=pendingFinal || confirm('Ferdig med leksa? Spark lager en kort oppsummering til foreldrene og lagrer økten.');
  if(!ok) return;

  stopSpeak(); stopMic(); busy=true; render();
  let summary=pendingFinal?.summary||'';
  let closing='Økten er ferdig.';
  if(!pendingFinal&&learningSession?.practice){summary='Kort øverunde. Se læringsoversikten for støtte og øving.';}
  else if(!pendingFinal) try{
    const finalPrompt = `Barnet eller forelderen har nå trykket «Ferdig med leksa». Avslutt økten nå.
Skriv først EN kort, varm avslutning til barnet, uten spørsmål og uten ny oppgave.
Legg deretter aller sist NØYAKTIG én skjult foreldresammendrag-linje i dette formatet:
[[LOGG: hva vi jobbet med | hva som gikk bra | hva som var vanskelig eller bør øves mer på]]
Vær konkret og ærlig ut fra denne samtalen. Ikke legg til PROFIL eller OPPGAVE i denne sluttmeldingen.`;
    const finalMessages = payload().concat([{role:'user',content:finalPrompt}]);
    const raw = await callAI(finalMessages);
    const lm = raw.match(/\[\[LOGG:\s*([^\]]+)\]\]/i);
    if(lm) summary = lm[1].trim().replace(/\s+/g,' ').slice(0,240);
    closing = harvest(raw,true) || closing;
    if(!summary){
      summary = fallbackFinalSummary();
      if(addParentLog(summary)) saveKids();
    }
  }catch(err){
    summary = fallbackFinalSummary();
    if(addParentLog(summary)) saveKids();
    closing = 'Økten er ferdig.';
  }

  if(!pendingFinal) chatMsgs.push({role:'assistant',text:closing});
  pendingFinal={summary}; saveSession();
  busy=false;
  if(!archiveSession(summary)){render();return;}
  pendingFinal=null;
  startNotice='Økten er ferdig og lagret. Du kan ta fri nå.';
  readOnly=false; pendingFinal=null; photoLoad++; hwPreview=null; hwText=''; chatMsgs=[]; history=[]; transcript='';
  usingBackup=false; backupAnnounced=false; resetLearning();
  view='start'; render();
}

/* ================= TALE INN ================= */
function speechInputSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function toggleMic(){
  if(!speechInputSupported() || busy || readOnly || pendingFinal || view!=='chat') return;
  if(listening && recognition){ recognition.stop(); return; }
  stopSpeak();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const current = new SR(); recognition=current;
  recognition.lang='nb-NO'; recognition.interimResults=false; recognition.maxAlternatives=1;
  recognition.onstart=()=>{ if(recognition!==current)return;listening=true; render(); };
  recognition.onend=()=>{ if(recognition!==current)return;listening=false; recognition=null; render(); };
  recognition.onerror=e=>{
    if(recognition!==current)return;
    listening=false; recognition=null;
    if(e.error!=='aborted' && e.error!=='no-speech'){
      chatMsgs.push({role:'assistant',text:'🎙️ Jeg fikk ikke tak i det du sa. Prøv igjen eller skriv svaret.',sys:true});
    }
    render();
  };
  recognition.onresult=e=>{
    if(recognition!==current || view!=='chat' || busy || readOnly)return;
    const said=(e.results?.[0]?.[0]?.transcript||'').trim();
    if(said){ $('msg').value=said; $('msg').dispatchEvent(new Event('input')); voiceNotice='Talen er et tekstforslag. Sjekk og rett teksten før du sender. Spark vurderer ikke uttale.';showStatus(); }
  };
  try{ recognition.start(); }catch(e){ listening=false; recognition=null; alert('Mikrofonen kunne ikke starte. Sjekk mikrofontillatelsen eller skriv svaret.'); render(); }
}

/* ================= KNAPPER ================= */
$('sendBtn').onclick=send;
$('micBtn').onclick=toggleMic;
$('doneBtn').onclick=finishHomework;
$('msg').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});
$('msg').addEventListener('input',e=>{
  e.target.style.height='auto';
  e.target.style.height=Math.min(e.target.scrollHeight,96)+'px';
});
$('voiceBtn').onclick=()=>{
  voiceOn=!voiceOn; store.setItem(LS.voice,voiceOn?'1':'0');
  if(!voiceOn) stopSpeak(); render();
};
$('backBtn').onclick=()=>{                       // tilbake, økten beholdes
  if(busy) return;
  stopSpeak(); stopMic(); if(!readOnly && !saveSession()) return;
  readOnly=false; view='start'; render();
};
$('newBtn').onclick=()=>{                        // ny oppgave, den gamle arkiveres
  if(busy) return;
  startNotice=''; stopSpeak(); stopMic();
  if(!readOnly && chatMsgs.length>1){
    if(!confirm('Starte på en ny oppgave? Denne økten lagres under «Tidligere økter».')) return;
    if(!archiveSession(pendingFinal?.summary||'')) return;
  }
  readOnly=false; pendingFinal=null; photoLoad++; hwPreview=null; hwText=''; chatMsgs=[]; history=[]; transcript='';
  view='start'; render();
};
$('cogBtn').onclick=()=>{if(busy) return;stopSpeak();stopMic();if(view==='chat'&&!readOnly&&!saveSession())return;view='setup';render()};

/* Androids tilbake-knapp skal ikke lukke appen midt i en oppgave */
history_guard();
function history_guard(){
  window.history.pushState({v:'spark'},'');
  window.addEventListener('popstate',()=>{
    window.history.pushState({v:'spark'},'');
    if(busy) return;
    if(view==='chat'){ stopSpeak(); stopMic(); if(!readOnly&&!saveSession()) return; readOnly=false; view='start'; render(); }
    else if(view==='hist'||view==='setup'){ view='start'; render(); }
  });
}

// Expire abandoned sessions of every child, not only the opened one (aggregates are kept by loadSession).
function sweepSessions(){for(let i=0;i<kids.length;i++)loadSession(i);}
sweepSessions();
/* PWA: registrer service worker hvis appen kjøres fra en ekte nettadresse */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(()=>{});
}

window.addEventListener('pagehide',()=>{if(view==='chat'&&!readOnly) saveSession();});
document.addEventListener('visibilitychange',()=>{if(document.hidden && view==='chat'&&!readOnly){if(learningSession)learningSession.lastInteraction=null;stopMic();stopSpeak();saveSession();}});
render();
</script>
